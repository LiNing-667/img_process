<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>小车遥控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        html,
        body {
            background: #0f1420;
            color: #e8eaf0;
            font-family: system-ui, Arial, sans-serif;
        }

        #video {
            width: 100vw;
            height: auto;
            display: block;
            background: #000;
            border-bottom: 2px solid #26324a;
        }

        .ctrl {
            max-width: 420px;
            margin: 12px auto;
            padding: 0 12px;
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            background: #1c2740;
            border: 2px solid #2e3f63;
            border-radius: 14px;
            color: #cfd8ee;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 88px;
            cursor: pointer;
            transition: transform .08s, background .08s, border-color .08s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #8b96ad;
            margin-top: 2px;
        }

        .btn:active,
        .btn.down {
            background: #e0455a;
            border-color: #ff6b81;
            transform: scale(.93);
            color: #fff;
        }

        .btn.down small {
            color: #ffe;
        }

        .btn.rot {
            background: #2a1f4d;
            border-color: #4a3a8a;
        }

        .btn.rot:active,
        .btn.rot.down {
            background: #7b3ff2;
            border-color: #a678ff;
            color: #fff;
        }

        #stop {
            background: #3a1520;
            border-color: #7a2038;
            color: #ff8a9b;
        }

        #stop:active,
        #stop.down {
            background: #ff2244;
            border-color: #ff5577;
            color: #fff;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 8px;
        }

        .bar b {
            font-size: 15px;
            letter-spacing: 1px;
        }

        .speed {
            font-size: 13px;
            color: #ffd166;
            background: #1c2740;
            border: 1px solid #2e3f63;
            border-radius: 8px;
            padding: 4px 10px;
        }

        .cmdbar {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .cmdbar input {
            flex: 1;
            background: #1c2740;
            border: 1px solid #2e3f63;
            color: #e8eaf0;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            min-width: 0;
            -webkit-user-select: text;
            user-select: text;
        }

        .cmdbar input::placeholder {
            color: #5c6781;
        }

        .cmdbar input:focus {
            border-color: #4a5f8a;
        }

        .cmdbar button {
            background: #1c5c2e;
            border: 1px solid #2e8a48;
            color: #d7ffdf;
            border-radius: 10px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .cmdbar button:active {
            background: #2e8a48;
        }

        .hint {
            font-size: 12px;
            color: #5c6781;
            text-align: center;
            margin-top: 12px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <img id="video" src="/stream" alt="实时画面">

    <div class="ctrl">
        <div class="bar">
            <b>🚗 小车遥控</b>
            <span class="speed" id="status">待机</span>
        </div>

        <!-- 任意文本指令输入 -->
        <div class="cmdbar">
            <input id="cmdinput" type="text" placeholder="输入指令，如 MOVE 10 20 0 / MR / DEMO000">
            <button id="cmdsend">发送</button>
        </div>

        <div class="pad">
            <button class="btn rot" id="bQ">⟲<small>Q 左转</small></button>
            <button class="btn" id="bW">▲<small>W 前进</small></button>
            <button class="btn rot" id="bE">⟳<small>E 右转</small></button>
            <button class="btn" id="bA">◀<small>A 左移</small></button>
            <button class="btn" id="stop">■<small>急停</small></button>
            <button class="btn" id="bD">▶<small>D 右移</small></button>
            <div></div>
            <button class="btn" id="bS">▼<small>S 后退</small></button>
            <div></div>
        </div>
        <div class="hint">触控按住移动，松开即停<br>W 前 · S 后 · A 左移 · D 右移 · Q 左转 · E 右转</div>
    </div>

    <script>
        // ===== 速度标定 (可在此调整) =====
        const SPEED = 300;   // 平移速度 (与 CMD_SPEED_BASE 一致)
        const TURN = 0.6;   // 旋转角速度 vw (K=345, vw*K≈207 接近起步死区)

        const keyVel = {
            W: [SPEED, 0, 0],
            S: [-SPEED, 0, 0],
            A: [0, -SPEED, 0],
            D: [0, SPEED, 0],
            Q: [0, 0, -TURN],
            E: [0, 0, TURN],
        };

        let active = new Set();
        let lastVel = '';

        function sendVel() {
            let vx = 0, vy = 0, vz = 0;
            active.forEach(k => { const v = keyVel[k]; vx += v[0]; vy += v[1]; vz += v[2]; });
            const vel = vx + ',' + vy + ',' + vz;
            if (vel === lastVel) return;               // 速度没变化就不重复发，避免刷请求
            lastVel = vel;
            document.getElementById('status').textContent = (vx || vy || vz) ? '移动中' : '待机';
            // 逗号/数字是 URL query 合法字符，勿用 encodeURIComponent(会变成 %2C 导致后端分割失败)
            fetch('/ctrl?vel=' + vel).catch(() => { });
        }

        function press(k) { active.add(k); document.getElementById('b' + k).classList.add('down'); sendVel(); }
        function release(k) { active.delete(k); document.getElementById('b' + k).classList.remove('down'); sendVel(); }

        ['W', 'S', 'A', 'D', 'Q', 'E'].forEach(k => {
            const btn = document.getElementById('b' + k);
            btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press(k); });
            btn.addEventListener('pointerup', e => { e.preventDefault(); release(k); });
            btn.addEventListener('pointercancel', () => { release(k); });
            btn.addEventListener('pointerleave', () => { release(k); });
        });

        document.getElementById('stop').addEventListener('pointerdown', e => {
            e.preventDefault();
            active.forEach(k => document.getElementById('b' + k).classList.remove('down'));
            active.clear();
            lastVel = '';
            sendVel();
        });

        // 任意文本指令发送
        function sendCmd() {
            const txt = document.getElementById('cmdinput').value.trim();
            if (!txt) return;
            document.getElementById('status').textContent = '已发送: ' + txt;
            fetch('/cmd?text=' + encodeURIComponent(txt)).catch(() => { });
            document.getElementById('cmdinput').value = '';
        }
        document.getElementById('cmdsend').addEventListener('pointerdown', e => { e.preventDefault(); sendCmd(); });
        document.getElementById('cmdinput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendCmd(); } });

        // 桌面键盘调试支持
        document.addEventListener('keydown', e => {
            const k = e.key.toUpperCase();
            if (keyVel[k] && !e.repeat) { e.preventDefault(); press(k); }
        });
        document.addEventListener('keyup', e => {
            const k = e.key.toUpperCase();
            if (keyVel[k]) { release(k); }
        });

        // 页面离开时强制停车，防止小车失控
        window.addEventListener('pagehide', () => { active.clear(); fetch('/ctrl?vel=0,0,0'); });
    </script>
</body>

</html>
